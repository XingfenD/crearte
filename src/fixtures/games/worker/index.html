<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>worker fixture</title>
  </head>
  <body>
    <p id="out">worker</p>
    <script>
      const worker = new Worker('worker.js')
      worker.onmessage = (event) => {
        document.body.dataset.worker = String(event.data)
      }
    </script>
    <script>
      document.body.dataset.ready = '1'
    </script>
  </body>
</html>
