name: crearte-mock

# 运行时 mock：容器内跑 e2e 用的多源服务（宿主站 + *.localhost 游戏子域）
#
#   docker compose -f deploy/docker-compose.mock.yml up -d --build
#   宿主站 http://localhost:4173
#   游戏子域 http://<id>.localhost:4173（如 abs-paths.localhost:4173）
#
# 说明：
# - 启动时先执行 build:e2e，重建夹具与 dist，保证数据与当前源码一致（约十几秒后才开始监听）
# - 子域仅对本机浏览器有效（*.localhost 解析到 127.0.0.1），局域网其它设备访问不了游戏子域
# - 与 dev（docker-compose.dev.yml，8080）可同时运行，端口 4173 不冲突；WGC_MOCK_PORT 可覆盖
# - 改了 src/package.json 需要重新 --build
services:
  mock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    image: crearte:dev
    init: true
    ports:
      - "${WGC_MOCK_PORT:-4173}:4173"
    volumes:
      - ../src:/app
      - mock_node_modules:/app/node_modules
    command: sh -c "npm run build:e2e && node scripts/serve-runtime.mjs --port 4173"

volumes:
  mock_node_modules:
