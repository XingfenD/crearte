name: crearte-prod

# 生产模式：多阶段构建（node 出静态产物）→ nginx 托管
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   打开 http://localhost:8080
#
# 访问端口与开发模式统一为 8080（`WGC_PORT` 可覆盖），因此 prod / dev 不要同时起
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: crearte:local
    ports:
      - "${WGC_PORT:-8080}:80"
    restart: unless-stopped
