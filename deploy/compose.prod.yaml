name: webgame-collection-prod

# 生产模式：多阶段构建（node 出静态产物）→ nginx 托管
#
#   docker compose -f deploy/compose.prod.yaml up -d --build
#   打开 http://localhost:8080
#
# 端口可用 WGC_PORT 覆盖（例如本机 8080 已被占用：WGC_PORT=8081 ... up -d）
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: webgame-collection:local
    ports:
      - "${WGC_PORT:-8080}:80"
    restart: unless-stopped
