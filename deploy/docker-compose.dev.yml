name: crearte-dev

# 开发模式：源码目录挂载进容器，容器内跑 vite dev（HMR 可用）
#
#   docker compose -f deploy/docker-compose.dev.yml up --build
#   打开 http://localhost:8080
#
# 说明：
# - 访问端口与生产模式统一为 8080（`WGC_PORT` 可覆盖），因此 dev / prod 不要同时起
# - /app/node_modules 用命名卷隔离，避免宿主机的 node_modules 遮蔽容器内依赖
#   （mac/win 上宿主依赖是异平台二进制，会直接跑不起来）
# - 开发时改源码即时生效；改了 src/package.json 需要重新 --build
# - mac/win/网络盘上热更新不触发时，用 CHOKIDAR_USEPOLLING=true 起
# - 后端整套 Docker 部署在 8081（crearte-server/deploy/docker-compose.local.yml），
#   覆盖 .env.development 的 VITE_API_BASE_URL，避免请求发回前端自身
services:
  dev:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    image: crearte:dev
    init: true
    ports:
      - "${WGC_PORT:-8080}:5173"
    volumes:
      - ../src:/app
      - dev_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8081}"

volumes:
  dev_node_modules:
